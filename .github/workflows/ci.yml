name: CI
on: [push, pull_request]
jobs:
  mac-app:
    name: Mac app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = the oldest supported macOS (Sonoma), macos-latest = the current one; both Apple Silicon.
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build WaterCa7sPcCleaner.Mac.sln -c Release
      - name: Tests (they also save the pages on fixture data)
        # A hung test fails after 5 minutes with its name and a dump instead of blocking the job.
        run: dotnet test WaterCa7sPcCleaner.Mac.sln -c Release --no-build --blame-hang-timeout 5m
        env:
          MAC_SCREENSHOTS_DIR: ${{ github.workspace }}/demo-screenshots
      - name: Screenshots of this Mac (read-only)
        run: dotnet src/PcCleaner.Mac/bin/Release/net10.0/WaterCa7sPcCleaner.dll --screenshots screenshots
      - name: Build and sign the .app
        if: matrix.os == 'macos-latest'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: tools/mac/make-app.sh out
      - name: Update manifest dry run (throwaway key) and the app's own check of it
        if: matrix.os == 'macos-latest'
        run: |
          dir="$RUNNER_TEMP/update"
          mkdir -p "$dir"
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out "$RUNNER_TEMP/test-key.pem"
          openssl ec -in "$RUNNER_TEMP/test-key.pem" -pubout -out "$dir/public.pem"
          echo 'Проверочная сборка CI.' > "$RUNNER_TEMP/notes.md"
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PcCleaner.Mac/PcCleaner.Mac.csproj | head -n 1)"
          tools/mac/make-update-manifest.sh "$version" out/WaterCa7sPcCleaner-osx-arm64.zip "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/test-key.pem" "$dir"
          UPDATE_MANIFEST_DIR="$dir" dotnet test tests/PcCleaner.Mac.Tests -c Release --no-build --filter "FullyQualifiedName~ScriptManifest"
          rm -f "$RUNNER_TEMP/test-key.pem"
      - name: Capture tool output for fixtures (read-only)
        if: always()
        run: tools/mac/capture-fixtures.sh fixtures "out/WaterCa7s PC Cleaner.app"
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-latest'
        with:
          path: out/WaterCa7sPcCleaner-osx-arm64.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-screenshots-${{ matrix.os }}
          path: |
            screenshots
            demo-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-fixtures-${{ matrix.os }}
          path: fixtures
